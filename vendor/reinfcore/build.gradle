version = "4.0.9+26.2-port.${rootProject.port_revision}"
base { archivesName = 'reinforced-core' }

dependencies {
    compileOnly "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
