version = "4.0.0-beta+26.2-port.${rootProject.port_revision}"
base { archivesName = 'reinforced-chests' }

dependencies {
    implementation project(':reinfcore')
    include project(':reinfcore')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
